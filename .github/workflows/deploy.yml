name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        shell: powershell
        run: |
          "DB_HOST=db" | Out-File -FilePath .env -Encoding utf8
          "DB_PORT=5432" | Out-File -FilePath .env -Append -Encoding utf8
          "DB_NAME=${{ secrets.DB_NAME }}" | Out-File -FilePath .env -Append -Encoding utf8
          "DB_USER=${{ secrets.DB_USER }}" | Out-File -FilePath .env -Append -Encoding utf8
          "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" | Out-File -FilePath .env -Append -Encoding utf8
          "APP_PORT=5000" | Out-File -FilePath .env -Append -Encoding utf8
          "COMPOSE_PROJECT_NAME=myapp" | Out-File -FilePath .env -Append -Encoding utf8
          Write-Host "--- Created .env file: ---"
          Get-Content .env

      - name: Deploy with Docker Compose
        shell: powershell
        run: |
          docker-compose up -d --build
          Start-Sleep -Seconds 25
          docker-compose ps

      - name: Verify containers are running
        shell: powershell
        run: |
          $ps = docker-compose ps
          if ($ps -match "Up") {
            Write-Host "All containers are running"
          } else {
            Write-Host "Containers failed to start"
            docker-compose logs
            exit 1
          }

      - name: Show App Logs for Debugging
        shell: powershell
        run: |
          Write-Host "--- LOGS FROM APP CONTAINER ---"
          docker-compose logs app
          
      - name: Run application tests
        shell: powershell
        run: |
          Write-Host "1. Testing application and database connectivity..."
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:5000/health" -UseBasicParsing
            Write-Host "Web application is healthy"
          } catch {
            Write-Host "Web application health check failed"
            exit 1
          }

          Write-Host "2. Preparing database data..."
          docker-compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -c "DROP TABLE IF EXISTS items; CREATE TABLE items (id serial primary key, name varchar); INSERT INTO items (name) VALUES ('a'), ('b'), ('c'), ('d'), ('e');"

          Write-Host "3. Testing data consistency..."
          $DB_COUNT = (docker-compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;").Trim()
          $WEB_COUNT = (Invoke-WebRequest -Uri "http://localhost:5000/api/items/count" -UseBasicParsing).Content

          Write-Host "Database count: $DB_COUNT"
          Write-Host "Web API count: $WEB_COUNT"

          if ($DB_COUNT -eq $WEB_COUNT) {
            Write-Host "Data consistency test passed"
          } else {
            Write-Host "Data consistency test failed"
            exit 1
          }

      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            docker-compose.yml
          retention-days: 7